[project]
name = "{{PY_PROJECT_NAME}}"
version = "0.1.0"
description = "{{PY_PROJECT_DESCRIPTION}}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black==26.3.1",
    "isort==8.0.1",
    "pre-commit==4.5.1",
    "pycln==2.6.0",
    "pydantic==2.13.0",
    "pyright==1.1.408",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
]

[tool.pycln]
all = true

[tool.isort]
py_version=312
line_length = 120

[tool.black]
target-version = ["py312"]
line_length = 120

[tool.pyright]
pythonVersion = "3.12"
reportMissingImports = true
reportMissingTypeStubs = false
typeCheckingMode = "basic"
include = ["src"]
verboseOutput = false

[tool.pytest.ini_options]
pythonpath = ["src"]
