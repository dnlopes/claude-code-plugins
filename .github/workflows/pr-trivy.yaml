name: CI - Trivy
on:
  pull_request:

concurrency:
  group: pr-trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: dnlopes/Reusable.Workflows/.github/workflows/trivy-scan.yaml@c0dac1d07c91f702f889a8d033e59ebecf0e381c # v1
    permissions:
      contents: read
      pull-requests: write # needed for PR comments
      statuses: write # needed for setting the status of the PR

