name: CI - Conventions
on:
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize]

concurrency:
  group: pr-semantic-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  statuses: write
  contents: read

jobs:
  pr_labels:
    name: Labels
    runs-on: ubuntu-latest
    steps:
      - uses: srvaroa/labeler@v1.13.0
        with:
          config_path: .github/labeler-config.yaml
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  semantic_pr:
    needs: pr_labels
    name: Semantic
    uses: dnlopes/Reusable.Workflows/.github/workflows/semantic-pr.yaml@c0dac1d07c91f702f889a8d033e59ebecf0e381c # v1
