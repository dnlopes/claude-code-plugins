# Declarative manifest of skills vendored from external repositories.
# The sync-vendored-skills workflow uses this to fetch and update each entry.
# Source is the source of truth — local changes in `dest` will be overwritten.

skills:
  - name: react-best-practices
    dest: ui-dev/skills/react-best-practices
    plugin: ui-dev
    source:
      repo: vercel-labs/agent-skills
      ref: main
      path: skills/react-best-practices

  - name: web-design-guidelines
    dest: ui-dev/skills/web-design-guidelines
    plugin: ui-dev
    source:
      repo: vercel-labs/agent-skills
      ref: main
      path: skills/web-design-guidelines

  - name: shadcn
    dest: ui-dev/skills/shadcn
    plugin: ui-dev
    source:
      repo: shadcn-ui/ui
      ref: main
      path: skills/shadcn

  - name: agent-browser
    dest: ui-dev/skills/agent-browser
    plugin: ui-dev
    source:
      repo: vercel-labs/agent-browser
      ref: main
      path: skills/agent-browser

  - name: supabase-postgres-best-practices
    dest: backend-dev/skills/supabase-postgres-best-practices
    plugin: backend-dev
    source:
      repo: supabase/agent-skills
      ref: main
      path: skills/supabase-postgres-best-practices
